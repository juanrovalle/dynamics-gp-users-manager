name: Windows application
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static validation and unit tests
        shell: pwsh
        run: |
          ./tests/Validate.ps1
          dotnet run --project tests/DynamicsGP.UserOps.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Self-contained Windows publish
        shell: pwsh
        run: |
          ./packaging/Generate-Icon.ps1
          dotnet publish src/DynamicsGP.UserOps.Desktop -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicsGPUserOps-4.0.0-win-x64-${{ matrix.os }}
          path: artifacts/publish
