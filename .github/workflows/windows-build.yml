name: Windows application
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static validation and unit tests
        shell: pwsh
        run: |
          ./tests/Validate.ps1
          dotnet run --project tests/GPManager.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Self-contained Windows publish
        shell: pwsh
        run: |
          dotnet publish src/GPManager.Desktop -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GPUsersManager-win-x64-${{ matrix.os }}
          path: artifacts/publish
