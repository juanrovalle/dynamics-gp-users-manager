name: SQL integration
on: [push, pull_request, workflow_dispatch]
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: GPManager_CI_Only_2026!
    steps:
      - uses: actions/checkout@v6
      - name: Static validation
        shell: pwsh
        run: ./tests/Validate.ps1
      - name: Wait for isolated SQL Server
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in $(seq 1 30); do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GPManager_CI_Only_2026!' -C -b -Q 'SELECT 1'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Migration, repeat installation and behavior tests
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker cp . "$SQL_CONTAINER:/tmp/gp-manager"
          run_sql() {
            docker exec -w /tmp/gp-manager/src/Install "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'GPManager_CI_Only_2026!' -C -b -r 1 "$@"
          }
          run_sql -i ../../tests/fixture.sql
          run_sql -i install.sql -v ManagerDatabase=GPManagerTest GPDatabase=GPManagerTestGP DexDatabase=GPManagerTestDex
          run_sql -i ../../tests/prepare-v4-rollback.sql
          if run_sql -i install.sql -v ManagerDatabase=GPManagerTest GPDatabase=GPManagerTestGP DexDatabase=GPManagerTestDex; then
            echo 'Expected the injected schema-v4 migration failure.' >&2
            exit 1
          fi
          run_sql -i ../../tests/verify-v4-rollback.sql
          run_sql -i install.sql -v ManagerDatabase=GPManagerTest GPDatabase=GPManagerTestGP DexDatabase=GPManagerTestDex
          run_sql -i install.sql -v ManagerDatabase=GPManagerTest GPDatabase=GPManagerTestGP DexDatabase=GPManagerTestDex
          run_sql -i install.sql -v ManagerDatabase=GPManagerTestFresh GPDatabase=GPManagerTestGP DexDatabase=GPManagerTestDex
          run_sql -d GPManagerTestFresh -Q "IF (SELECT COUNT(*) FROM dbo.gpManagerSchemaVersion WHERE version=4)<>1 OR (SELECT automation_enabled FROM dbo.gpManagerSettings WHERE ID=1)<>0 THROW 52028, 'Fresh installation failed', 1;"
          run_sql -i ../../tests/integration.sql
          run_sql -i ../../tests/automation.sql
          run_sql -i ../../tests/administration.sql
